# to use tikzcd.

name: Documentation
on:
  push:
    branches:
      - main
permissions:
  contents: write   # read → write: 렌더된 SVG를 자동 커밋하기 위해
  pages: write
  id-token: write
concurrency:        # 빌드가 동시에 두 개 돌면서 자동 커밋끼리 충돌하는 것을 방지
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - run: pip install zensical pybtex beautifulsoup4

      # ---------- tikzcd ----------
      - name: Check tikzcd diagrams
        id: tikzcd
        run: |
          if python scripts/render_tikzcd.py --check; then
            echo "missing=false" >> "$GITHUB_OUTPUT"
          else
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install TeX (only when needed)
        if: steps.tikzcd.outputs.missing == 'true'
        timeout-minutes: 5
        run: |
          # Azure 미러 대신 Ubuntu 공식 미러 사용
          sudo sed -i 's#mirror+file:/etc/apt/apt-mirrors.txt#http://archive.ubuntu.com/ubuntu/#' \
            /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
            texlive-latex-recommended texlive-pictures dvisvgm
          dvisvgm --version

      - name: Render and commit diagrams
        if: steps.tikzcd.outputs.missing == 'true'
        run: |
          python scripts/render_tikzcd.py --prune
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tikzcd
          if ! git diff --cached --quiet; then
            git commit -m "Render tikzcd diagrams [skip ci]"
            git push || echo "::warning::SVG 자동 커밋 push 실패 (이번 배포에는 반영됨)"
          fi
      # ----------------------------
      - name: Generate contents
        run: python scripts/gen_toc.py

      - name: Resolve citations
        run: python scripts/cite.py
      
      - name: Append last-updated dates
        run: |
          git ls-files 'docs/*.md' 'docs/**/*.md' | while IFS= read -r f; do
            d=$(git log -1 --format=%cs -- "$f")
            printf '\n\n---\n\n<small>Last updated: %s</small>\n' "$d" >> "$f"
          done

      - run: python scripts/gen_nav.py
      - run: zensical build --clean
        env:
          PYTHONPATH: scripts
      - name: Number theorems
        run: python scripts/number_theorems.py site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deployment