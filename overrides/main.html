이 루트 주소를 운영하려면 이름이 riemannzetaftn.github.io인 저장소가 따로 있어야 해요. 지금은 그런 저장소가 없는 것 같은데, 제가 확인할 수 있는 범위에서는 확실하지 않아요. 아래 순서대로 하시면 돼요.

1단계 — 루트용 저장소 만들기 (GitHub 웹)

GitHub에서 New repository를 누르고 이름을 정확히 riemannzetaftn.github.io로 입력해요. Public으로 만들고 “Add a README”에 체크해요.
저장소의 Settings → Pages에서 Source를 “Deploy from a branch”, 브랜치를 main / /(root)로 고르고 저장해요.
이 저장소를 만들어도 기존 블로그 주소 /bib.arithmeticae/는 그대로 열려요. 이 저장소 안에 bib.arithmeticae라는 폴더만 만들지 않으면 돼요.

2단계 — 네이버에 사이트 등록

searchadvisor.naver.com에 들어가서 네이버 아이디로 로그인하고 웹마스터 도구를 눌러요.
사이트 등록 칸에 https://riemannzetaftn.github.io를 입력해요. 끝에 /bib.arithmeticae를 붙이지 않아요.

3단계 — 소유확인: “HTML 파일 업로드” 방식 추천
두 방식 가운데 파일 방식이 더 편해요. 메타 태그 방식은 1년마다 소유 확인을 연장해야 하는 번거로움이 있고, 파일 방식은 1년마다 갱신할 필요가 없어요.

1단계에서 만든 riemannzetaftn.github.io 저장소에서 Add file → Upload files로 이 파일을 그대로 올리고 커밋해요. 파일 이름과 내용은 절대 바꾸지 마세요.

4단계 — 사이트맵 제출
등록한 사이트를 누르고 요청 → 사이트맵 제출 메뉴로 가요. 여기는 Google과 달리 블로그가 하위 경로에 있으니 경로를 포함해서 입력해요.

입력칸 앞에 https://riemannzetaftn.github.io/가 미리 적혀 있다면 → bib.arithmeticae/sitemap.xml
전체 주소를 넣는 칸이라면 → https://riemannzetaftn.github.io/bib.arithmeticae/sitemap.xml

사이트맵 주소는 소유 확인한 사이트와 도메인이 같아야 하는데, 둘 다 riemannzetaftn.github.io라서 조건을 만족해요.
